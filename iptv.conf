# ============================================================
# IPTV 统一配置文件  (所有 iptv 脚本从这里读取参数)
# 部署: /etc/iptv.conf
# ------------------------------------------------------------
# 请按你的地区和运营商修改下面的值。
# 只改本文件即可，脚本无需再改动。
#
# !!! 关键信息(AUTHENTICATOR / USERID / STBID)请勿外传,
# !!! 更不要提交到公开仓库 —— 它们等同于你机顶盒的身份。
# ============================================================

# 电信内网 EPG 认证服务器 (格式: IP:端口, 不同地区/运营商不同)
EPG_HOST="182.146.96.245:8080"

# 开通 IPTV 的宽带账号 (机顶盒 PPPoE/DHCP 拨号账号)
USERID="<你的IPTV账号>@ITV"

# 机顶盒序列号/芯片ID (业务侧与账号绑定)
STBID="<你的机顶盒序列号>"

# 认证密钥 (运营商下发, 与 STBID 绑定, 一般长期不变)
AUTHENTICATOR="<你的认证密钥, 十六进制长串>"

# 机顶盒型号 / 门户组号 (个别地区不同, 默认即可)
STB_TYPE="MT5001"
USER_GROUP="42"

# 路由器局域网 IP (局域网内访问 EPG/m3u 的地址)
LAN_IP="192.168.1.1"

# 组播转 HTTP 端口 (rtp2httpd 监听端口)
HTTP_PORT="5140"

# 回看 RTSP 服务器 (time-shift), 格式 "IP:554"
TS_SERVER="<运营商回看服务器IP:554>"

# 回看拼接参数 vcdn (运营商标识)
TS_VENDOR="001"

# FCC 快速频道切换服务器 (机顶盒 frameset 的 ChannelFCCIP:ChannelFCCPort)
FCC_SERVER="<FCC服务器IP:端口>"

# IPTV 网段 / 机房网关 (hotplug 脚本据此加路由)
IGMP_NET="182.146.0.0/16"
IGMP_GW="<你的IPTV接口网关>"

# 频道组名 / 文件名标识 (改成你的城市)
CITY_NAME="<你的城市>"
CITY_ID="<city_id>"

# ---- 以下两项可选, 不写就用脚本内置默认值 ----
# 白名单关键词: 命中则不参与"无信号排除"(逗号分隔)。默认 "卫视"
# 另: CCTV1-17 始终在白名单内, 无需在此重复
# 注意: CHC 等付费电影频道**不在**白名单里 —— 它们靠重试+三态判定自己通过
# KEEP_KEYWORDS="卫视"
# 连续失败几个"轮次"才排除该频道。默认 2 (配合 --passes 2 即"两轮都无信号才排除")
# EXCLUDE_AFTER="2"
