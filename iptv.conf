# IPTV 配置, 所有脚本共用 (部署: /etc/iptv.conf)
# 含账号与密钥, 请勿外传或提交到公开仓库

EPG_HOST="<EPG服务器IP:端口>"
USERID="<IPTV账号>@ITV"
STBID="<机顶盒序列号>"
AUTHENTICATOR="<认证签名, 十六进制长串>"
PASSWORD="<IPTV账号密码>"

# 机顶盒型号 / 门户组号
STB_TYPE="MT5001"
USER_GROUP="42"

LAN_IP="192.168.1.1"
HTTP_PORT="5140"

TS_SERVER="<回看服务器IP:554>"
TS_VENDOR="001"
FCC_SERVER="<FCC服务器IP:端口>"

# EDS 调度服务: 开机时向它询问当前 token/EPG 服务器地址
# 域名需 IPTV 内网 DNS 才能解析, 建议直接写 IP; 留空则跳过发现
EDS_HOST="<EDS调度服务器IP:8001>"

# 以下网段经 iptv 接口路由, 由 25-iptv-route 持久化
IGMP_NET="<IPTV业务网段/掩码>"
IGMP_GW="<IPTV接口网关>"
TOKEN_NET="<token服务器网段/掩码>"
EDS_NET="<EDS调度网段/掩码>"

# 可选: 固定 token 服务器; 留空则只依赖 EDS 发现
# TOKEN_HOST="<token服务器IP:端口>"

CITY_NAME="<城市>"
CITY_ID="<city_id>"

# 可选: 白名单关键词(逗号分隔) / 连续失败几轮才排除
# KEEP_KEYWORDS="卫视"
# EXCLUDE_AFTER="2"
